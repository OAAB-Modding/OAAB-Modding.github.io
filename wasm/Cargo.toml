[package]
name = "oaab-tes3-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Browser-facing TES3 parsing boundary for the OAAB Library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tes3 = { git = "https://github.com/Greatness7/tes3", rev = "44ea38ca389f5361229eef4800373b3df13f7063", default-features = false, features = ["nif"] }
wasm-bindgen = "=0.2.117"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory"]
